<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URLGuard AI — Malicious URL Detection Platform</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2306b6d4'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z'/></svg>" />
</head>
<body>
  <!-- Header & Navigation Bar -->
  <header class="navbar">
    <a href="#" class="brand" onclick="switchTab('home'); return false;">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <span>URLGuard <span style="color:var(--accent-cyan); font-weight:400;">AI</span></span>
    </a>

    <nav>
      <ul class="nav-links">
        <li><button class="nav-btn active" data-tab="home">Home</button></li>
        <li><button class="nav-btn" data-tab="scanner">URL Scanner</button></li>
        <li><button class="nav-btn" data-tab="dashboard">Dashboard</button></li>
        <li><button class="nav-btn" data-tab="model">Model Info</button></li>
        <li><button class="nav-btn" data-tab="about">About</button></li>
      </ul>
    </nav>

    <div id="backend-status" class="status-badge status-offline">
      <span class="pulse-dot"></span> Checking API...
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="main-content">
    <div id="content-area">
      <!-- Injected by app.js -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div style="max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
      <div>
        <strong>URLGuard AI</strong> — Academic Detection Prototype (Random Forest Lexical Classifier)
      </div>
      <div>
        Built with FastAPI, scikit-learn, and Manifest V3 Extension
      </div>
    </div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
